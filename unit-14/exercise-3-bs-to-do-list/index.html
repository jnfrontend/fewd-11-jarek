<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unit 14 (Exercise 3) Bootstrap - Simple TODO List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="bg-light bg-gradient">
    <header class="container-fluid border-bottom border-light-subtle bg-white text-center">
      <div class="row">
        <div class="col-12 p-3">
          <h3 class="fw-bold fs-4">UNIT 14</h3>
          <h1 class="fw-light fs-4">Exercise 3 - Bootstrap Simple TO-DO List</h1>
        </div>
      </div>
    </header>
    <section class="component-simple-to-do-list p-0 pt-5">
      <div class="container component-simple-to-do-list__items p-4">
        <div class="row">
          <div class="col-12">
            <h3 class="pb-4 mb-0 border-bottom">My List</h3>
            <table class="table table-striped mb-0">
              <thead>
                <!-- Title -->
                <th>Title</th>
                <!-- Description -->
                <th>Description</th>
                <!-- Priority -->
                <th>Priority</th>
                <th></th>
              </thead>
              <tbody id="to-do-items-container"></tbody>
            </table>
          </div>
          <div class="col-12">
            <!-- Button trigger modal -->
            <button type="button" class="btn btn-primary fw-bold w-100" data-bs-toggle="modal" data-bs-target="#addItemModal" data-modal-action="add">
              Add Item
            </button>
          </div>
        </div>
      </div>

      <!-- Modal -->
      <div class="modal fade" id="addItemModal" tabindex="-1" aria-labelledby="addItemModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-4 fw-bold" id="addItemModalLabel">Add to the list</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="container-fluid component-simple-to-do-list__form p-0">
              <div class="row">
                <form id="to-do-list-form">
                  <div class="modal-body bg-white p-3">
                    <div class="col-12 mb-3">
                      <!-- <label for="title">Title</label> -->
                      <input type="text" id="title" name="title" placeholder="Title" required>
                    </div>
                    <div class="col-12 mb-3">
                      <!-- <label for="description">Description...</label> -->
                      <textarea id="description" name="description" placeholder="Description" rows="5" required class="d-flex"></textarea>
                    </div>
                    <div class="col-12">
                      <select id="priority" name="priority" required>
                        <option value="" selected disabled>Please select priority</option>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                      </select>
                    </div>
                  </div>
                  <div class="modal-footer">
                    <!-- <input id="reset-btn" type="reset" value="Clear" class="btn btn-secondary mb-3"></input> -->
                    <input id="modalAction" type="hidden" name="modalAction" value="add">
                    <input id="itemId" type="hidden" name="itemId" value="">
                    <input id="submit-btn" type="submit" value="Add item to the list" class="btn btn-primary w-100 bg-success text-white fw-bold"></input>
                  </div>
                </form>
              </div>
            </div>
          </div> 
        </div>
      </div>
    </section>

    <footer>
      <div class="container-fluid">
        <div class="row">
          <div class="col-12 text-center">
            <small>©2025 Made by JN</small>
          </div>
        </div>
      </div>
    </footer>
    <!-- <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    <script src="js/main.js"></script>
  </body>
</html>
