  <body>

    <h1>Dynamic HTML</h1>

    <h2>1. Dynamic Content:</h2>
    <div id="dynamic_content" class="container"></div>
    <br />
    <hr />
    <h2>2. Dynamically Added Items:</h2>
    <div id="dynamic_items" class="container">
      <button onclick="add('item 1')">Add Item One</button>
      <button onclick="add('item 2')">Add Item Two</button>
      <button onclick="add('item 3')">Add Item Three</button>
      <button onclick="add('item 4')">Add Item Four</button>
      <button onclick="add('item 5')">Add Item Five</button>

      <!-- onclick="add({ title: 'item 1', price: 20, qtd: 3})" -->
    </div>
