<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unit 10 Exercise 1 - Slideshow (Carousel Slider)</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <h1>Unit 10 Exercise 1 - Slideshow (Carousel Slider)</h1>
    <section class="component-carousel">
      <div id="carousel-container" class="carousel-container">
        <div class="slider-carousel">
          <!-- Slide 1 -->
          <div class="slide main">
            <img
              src="https://cdn.pixabay.com/photo/2022/11/29/11/31/robin-7624340_1280.jpg"
              alt="nature 1"
            />
            <div class="image-text">
              <h3>Image 1</h3>
              <p>Subtitle text</p>
            </div>
          </div>
          <!-- Slide 2 -->
          <div class="slide">
            <img
              src="https://cdn.pixabay.com/photo/2015/11/16/16/28/bird-1045954_1280.jpg"
              alt="nature 2"
            />
            <div class="image-text">
              <h3>Image 2</h3>
              <p>Subtitle text</p>
            </div>
          </div>
          <!-- Slide 3 -->
          <div class="slide">
            <img
              src="https://cdn.pixabay.com/photo/2021/12/11/12/15/bird-6862640_1280.jpg"
              alt="nature 3"
            />
            <div class="image-text">
              <h3>Image 3</h3>
              <p>Subtitle text</p>
            </div>
          </div>
          <!-- Slide 4 -->
          <div class="slide">
            <img
              src="https://cdn.pixabay.com/photo/2016/08/11/23/48/mountains-1587287_1280.jpg"
              alt="nature 4"
            />
            <div class="image-text">
              <h3>Image 4</h3>
              <p>Subtitle text</p>
            </div>
          </div>
          <!-- Slide 5 -->
          <div class="slide">
            <img
              src="https://cdn.pixabay.com/photo/2016/09/19/22/46/lake-1681485_1280.jpg"
              alt="nature 4"
            />
            <div class="image-text">
              <h3>Image 5</h3>
              <p>Subtitle text</p>
            </div>
          </div>
          <!-- Navigation Arrows -->
          <div class="navigation-buttons">
            <a class="previous">❮</a>
            <a class="next">❯</a>
          </div>
        </div>

        <!-- Navigation Dots are dynamically added -->
        <!-- 
          <div class="navigation-dot-container">
            <span class="navigation-dot"></span>
            <span class="navigation-dot"></span>
            <span class="navigation-dot"></span>
            <span class="navigation-dot"></span>
            <span class="navigation-dot"></span>
          </div> 
        -->
      </div>
    </section>
    <script src="js/main.js"></script>
  </body>
</html>
