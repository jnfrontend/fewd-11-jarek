<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit-7 CSS Advanced</title>
    <style>
        div { 
            display: block;
            width: 150px;
            height: 150px;
            background-color: gold;
            background-image: linear-gradient(goldenrod, gold);
            border: 3px lightcoral solid;
            border-radius: 0 0 8px 8px;
            box-shadow: 5px 5px 15px -2px burlywood;
            transition: all 1s ease;
        }
        div:hover {
            width: 200px;
            height: 200px;
        }
        p {
            text-shadow: 2px 1px 2px white;
            text-align: center;
        }
        a {
            display: block;
            text-align: center;
            font-size: 16px;
            text-decoration: none;
            font-weight: 700;
            padding: 10px 0;
            text-transform: uppercase;
            transition: all .5s ease 0.25s;
            color: #885207;
            background-color: gold;
        }
        a:hover {
            background-color: lightcoral;
            color: white;
        }
    </style>
</head>
<body>
    <div>
        <p>This is text shadow</p>
        <a href="#">Click me</a>
    </div>
</body>
</html>
