<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit-11 Exercise 1 - Factorial (using slider)</title>
</head>
<body>
  <header>
    <h3>Unit 11</h3>
    <h1>Exercise 1 - Factorial (using slider)</h1>
  </header>
  <hr>
  <section class="component-factorial">
    <p>Display a range of factorials</p>
    <label for="factorialSlider">Select a number (between 1 and 20):</label>
    <input type="range" id="factorialSlider" name="factorialSlider" min="1" max="20" value="1">
    <div class="factorial-output-container"></div>  
  </section>
  <script src="js/main.js"></script>
</body>
</html>
